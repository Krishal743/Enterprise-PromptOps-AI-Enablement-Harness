name: AI quality gates

on:
  pull_request:
    paths:
      - "ops_ai/**"
      - "data/**"
      - "prompts/**"
      - "eval/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "promptfooconfig.yaml"
      - "compose.yaml"
      - ".github/workflows/eval.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Python package
        run: python -m pip install -e '.[dev]'
      - name: Unit tests
        run: python -m pytest -q
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Build structural golden cases
        run: python -m eval.build_promptfoo_cases --mode structural
      - name: Promptfoo structural regression
        env:
          OPS_LLM_PROVIDER: mock
          PROMPTFOO_PYTHON: python
          PROMPTFOO_DISABLE_TELEMETRY: "1"
        run: npx --yes promptfoo@0.124.0 eval -c promptfooconfig.yaml --no-cache --max-concurrency 3 -o eval-results-structural.json -o eval-results-structural.html
      - name: Start local model
        run: bash scripts/start_ollama_ci.sh
      - name: Build sampled live golden cases
        run: python -m eval.build_promptfoo_cases --sample-per-type 1
      - name: Promptfoo live prompt regression
        env:
          OPS_LLM_PROVIDER: ollama
          OPS_MODEL: qwen3:4b
          OPS_OLLAMA_HOST: http://127.0.0.1:11434
          OPS_EVAL_JUDGE: ollama:chat:qwen3:4b
          REQUEST_TIMEOUT_MS: "300000"
          PROMPTFOO_PYTHON: python
          PROMPTFOO_DISABLE_TELEMETRY: "1"
        run: npx --yes promptfoo@0.124.0 eval -c promptfooconfig.yaml --no-cache --max-concurrency 1 -o eval-results-live.json -o eval-results-live.html
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-eval-report
          path: |
            eval-results-*.json
            eval-results-*.html
          if-no-files-found: ignore
