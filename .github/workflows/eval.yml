name: AI quality gates

on:
  pull_request:
    paths:
      - "ops_ai/**"
      - "data/**"
      - "prompts/**"
      - "eval/**"
      - "tests/**"
      - "pyproject.toml"
      - "promptfooconfig.yaml"
      - ".github/workflows/eval.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Python package
        run: python -m pip install -e '.[dev]'
      - name: Unit tests
        run: python -m pytest -q
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Build Promptfoo cases
        run: python -m eval.build_promptfoo_cases
      - name: Require evaluation credential
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: test -n "$OPENAI_API_KEY"
      - name: Promptfoo golden regression
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPS_LLM_PROVIDER: openai
          OPS_MODEL: gpt-4o-mini
          PROMPTFOO_PYTHON: python
          PROMPTFOO_DISABLE_TELEMETRY: "1"
        run: npx --yes promptfoo@0.124.0 eval -c promptfooconfig.yaml --no-cache --max-concurrency 3 -o eval-results.json -o eval-results.html
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-eval-report
          path: |
            eval-results.json
            eval-results.html
          if-no-files-found: ignore
